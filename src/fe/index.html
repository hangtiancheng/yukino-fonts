<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rico — A Latin-only handwritten typeface in two cuts."
    />
    <title>Rico — A Latin-only handwritten typeface</title>
    <!--
      The Rico 1 / Rico 2 preload links (fetchpriority="low") are inserted
      from main.tsx via Vite asset imports, so the preload URL always
      matches the @font-face url() exactly in dev and build. A static href
      here only rewrites at build time and misses in dev.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
